apiVersion: 1

datasources:
  - name: ClickHouse
    uid: movie-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: grafana_reader
      defaultDatabase: default
      dialTimeout: 5
      queryTimeout: 20
    secureJsonData:
      password: grafana-local
